<!DOCTYPE html>

<html>
<head>
    <title>Math Package</title>
</head>

<body>

<h1>Math Package</h1>

<h2>Addition</h2>

<input id="add1">
<input id="add2">
<input id="add3">

<button onclick="addition()">
Add
</button>

<p id="addResult"></p>

<hr>
<h2>Division</h2>
<input id="div1" placeholder="Dividend">
<input id="div2" placeholder="Divisor">
<input id="div3" placeholder="Third divisor (optional)">
<button onclick="division()">
  Divide
</button>
<p id="divisionResult"></p>
<hr>
<h2>Prime Checker</h2>

<input id="prime">

<button onclick="prime()">
Check
</button>

<p id="primeResult"></p>


<script src="script.js"></script>

</body>
</html>
